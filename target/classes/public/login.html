<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión — Inventario Meccanimation</title>    
    <link rel="icon" type="image/png" href="css/img/favicon.png">


    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/normalize.css">
</head>
<body class="login-pagina">
    <div class="login-shell">

        <div class="login-logo">
            <img src="css/img/favicon.png" alt="Logo de Meccanimation">
        </div>

        <div class="login-branding">
            <p class="inventario-login">Inventario</p>
            <h1>Meccanimation</h1>
        </div>

        <div class="login-campos">
            <h2>Iniciar sesión</h2>

            <form id="form-login" class="login-form">
                <div class="campo login-campo">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="campo login-campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn-guardar login-btn">Entrar</button>
            </form>

            <p id="login-error" class="login-error" aria-live="polite"></p>
        </div>

    </div>

    <script src="js/login.js"></script>
</body>
</html>
