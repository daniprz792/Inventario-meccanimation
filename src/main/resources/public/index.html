<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Meccanimation</title>

     <link rel="stylesheet" href="css/style.css"> 
    <link rel="stylesheet" href="css/normalize.css">
</head>

<body>

    <header class="cabecera">
        <h1>Inventario Meccanimation</h1>
    </header>

    <div class="seccion-formulario">
        <h2>Agregar Producto</h2>

        <form id="form-item">
            <input type="hidden" id="itemId">

            <div class="campo">
                <label>Código:</label>
                <input type="text" id="codigoInventario" required>
            </div>

            <div class="campo">
                <label>Producto:</label>
                <input type="text" id="producto" required>
            </div>

            <div class="campo">
                <label>Nombre:</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="campo">
                <label>Descripcion:</label>
                <input type="text" id="descripcion">
            </div>

            <div class="campo">
                <label>Precio unitario:</label>
                <input type="number" min="0" id="precioUnitario" step="0.01" required>
            </div>

            <div class="campo">
                <label>Cantidad:</label>
                <input type="number" min="1" id="cantidadExistencias" required>
            </div>

            <div class="campo">
                <label>Fecha ingreso:</label>
                <input type="date" id="fechaIngreso">
            </div>

            <div class="campo">
                <label>Observaciones:</label>
                <input type="text" id="observaciones">
            </div>

            <button type="submit" class="btn-guardar">Guardar</button>
        </form>
    </div>

    <div class="seccion-tabla">
        <h2>Inventario</h2>

        <table class="tabla-inventario">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Producto</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Valor total</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-items">
            </tbody>
        </table>
    </div>

    <script src="js/app.js"></script>

        <script src="js/app.js"></script>

    <div id="modal-detalle" class="modal oculto">
        <div class="modal-contenido">
            <button class="modal-cerrar" onclick="cerrarDetalle()">&times;</button>
            <h3 id="detalle-nombre"></h3>
            <img id="detalle-imagen" src="" alt="Imagen del producto">
            <p><strong>Descripcion:</strong> <span id="detalle-descripcion"></span></p>
            <p><strong>Observaciones:</strong> <span id="detalle-observaciones"></span></p>
            <p><strong>Fecha ingreso:</strong> <span id="detalle-fecha"></span></p>
        </div>
    </div>
</body>
