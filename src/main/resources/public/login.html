<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión — Inventario Meccanimation</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/normalize.css">
</head>
<body>
    <div class="seccion-formulario login-contenedor">
        <h2>Iniciar sesión</h2>
        <form id="form-login">
            <div class="campo">
                <label>Usuario:</label>
                <input type="text" id="username" required>
            </div>
            <div class="campo">
                <label>Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-guardar">Entrar</button>
        </form>
        <p id="login-error" class="escaner-mensaje error"></p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
